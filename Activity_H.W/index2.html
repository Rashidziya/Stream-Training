<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Request Form</title>
<!-- #f8f9fa -->
  <!-- ✅ Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #a3c6e8;
    }
    .form-container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h3 class="text-center mb-4 text-primary">Vacation Request Form</h3>

    <!-- Form Start -->
    <form id="vacationForm" novalidate>
      <!-- Name -->
      <div class="form-group mb-3">
        <label for="name" class="form-label" >Full Name</label>
        <input type="text" placeholder="Eg : Md Rashid Reyaz" class="form-control" id="name" required>
        <div class="invalid-feedback">
          Please enter your full name.
        </div>
      </div>

      
      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" required>
        <div class="invalid-feedback">
          Please provide a valid email address.
        </div>
      </div>

      <div class="form-group mb-3">
        <label for="name" class="form-label" >Source City</label>
        <input type="text"  class="form-control" id="name" required>
        <div class="invalid-feedback">
          Please enter your full name.
        </div>
      </div>

      
      <div class="form-group mb-3">
        <label for="name" class="form-label" >Destination City</label>
        <select name="destination" id="destination" class="form-select" required>
            <option value="">----Select your destination----</option>
            <option value="Paris">Paris</option>
            <option value="Istanbul">Istanbul</option>
            <option value="Alaska">Alaska</option>
            <option value="Morocco">Morocco</option>
            <option value="Madinah">Madinah</option>
        </select>
        <div class="invalid-feedback">
          Please enter your full name.
        </div>
      </div>

      
      <div class="form-group mb-3">
        <label for="name" class="form-label" >Transportation Mode</label>
        <select name="transport-mode" id="transport-mode" class="form-select" required>
            <option value="">----Select Mode of Transportation----</option>
            <option value="Railway">Railway</option>
            <option value="Flight">Flight</option>
            <option value="By Road">By Road</option>
        </select>
        <div class="invalid-feedback">
          Please enter your full name.
        </div>
      </divFlight

      <!-- Start Date -->
      <div class="mb-3">
        <label for="startDate" class="form-label">Start Date</label>
        <input type="date" class="form-control" id="startDate" required>
        <div class="invalid-feedback">
          Please select a start date.
        </div>
      </div>

      <!-- End Date -->
      <div class="mb-3">
        <label for="endDate" class="form-label">End Date</label>
        <input type="date" class="form-control" id="endDate" required>
        <div class="invalid-feedback">
          Please select an end date.
        </div>
      </div>

      <!-- Reason -->
      <div class="mb-3">
        <label for="reason" class="form-label">Reason for Vacation</label>
        <textarea class="form-control" id="reason" rows="3" required></textarea>
        <div class="invalid-feedback">
          Please mention a reason.
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100">Submit Request</button>
    </form>
  </div>

  <!-- ✅ JavaScript Validation Script -->
  <script>
    const form = document.getElementById('vacationForm');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent form submission for now

      if (!form.checkValidity()) {
        event.stopPropagation();
      } else {
        alert('✅ Vacation request submitted successfully!');
        form.reset();
      }

      form.classList.add('was-validated');
    });
  </script>

</body>
</html>
