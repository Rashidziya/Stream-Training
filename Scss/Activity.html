<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Portfolio</title>
  </head>
  <body>
    <div class="pet-card">
      <img src="dog.jpg" alt="Buddy the dog" class="pet-img" />

      <div class="pet-info">
        <h2 class="pet-name">Buddy</h2>
        <p class="pet-breed">Golden Retriever</p>
        <p class="pet-age">2 years old</p>
        <p class="pet-gender">Male</p>
        <p class="pet-desc">
          Buddy is a playful golden retriever who loves running in the park and
          fetching balls!
        </p>
      </div>

      <div class="pet-actions">
        <button class="btn-adopt">Adopt Me</button>
        <button class="btn-more">View More</button>
      </div>
    </div>
  </body>
</html>
