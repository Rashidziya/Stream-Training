<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>My Restaurant</title>
  </head>
  <body>
    <div>
      <nav
        class="navbar"
        style="background-color: #e3f2fd; "
        data-bs-theme="light"
      >
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">My Restaurant</span>
        </div>
      </nav>
    </div>

    <div class="container">
      <button type="button" class="btn btn-primary btn-lg text-center">
        Our Menu
      </button>

      <div class="row">
        <div class="col-md-4">
          <div class="text-center">
            <p class="h3">Veg</p>
          </div>
          <div class="list-group">
            <a
              href="#"
              class="list-group-item list-group-item-action active"
              aria-current="true"
            >
              Veg Burger
            </a>
            <a href="#" class="list-group-item list-group-item-action"
              >Veg Biryani</a
            >
            <a href="#" class="list-group-item list-group-item-action"
              >Shahee Paneer</a
            >
            <a href="#" class="list-group-item list-group-item-action"
              >Veg Momo</a
            >
          </div>
        </div>

        <div class="col-md-4">
          <div class="text-center">
            <p class="h3">Non-Veg</p>
          </div>
          <div class="list-group">
            <a
              href="#"
              class="list-group-item list-group-item-action active"
              aria-current="true"
            >
              Chicken Burger
            </a>
            <a href="#" class="list-group-item list-group-item-action"
              >Mutton Biryani</a
            >
            <a href="#" class="list-group-item list-group-item-action"
              >Chicken 65</a
            >
            <a href="#" class="list-group-item list-group-item-action"
              >Chicken Momo</a
            >
          </div>
        </div>

        <div class="col-md-4">
          <div class="text-center">
            <p class="h3">Beverages</p>
          </div>
          <div class="list-group">
            <a
              href="#"
              class="list-group-item list-group-item-action active"
              aria-current="true"
            >
              Milkshake
            </a>
            <a href="#" class="list-group-item list-group-item-action"
              >Cold Coffee</a
            >
            <a href="#" class="list-group-item list-group-item-action">Pepsi</a>
            <a href="#" class="list-group-item list-group-item-action">Coke</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
